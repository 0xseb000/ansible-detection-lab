---
# Not passed as an include_role param on purpose: the collection role merges
# its own grafana_ini_default into this via set_fact, and role params outrank
# set_fact, which would drop database/paths/auth.
grafana_ini:
  server:
    http_port: "{{ w_grafana_http_port }}"
    root_url: "http://{{ observability_ip }}:{{ w_grafana_http_port }}"
  security:
    admin_user: admin
    admin_password: "{{ grafana_admin_password }}"
  users:
    allow_sign_up: false

# Fixed UIDs: dashboard JSONs reference them, random UIDs break every panel.
w_grafana_datasources:
  - name: Prometheus
    type: prometheus
    uid: "{{ ds_uid_prometheus }}"
    access: proxy
    url: "http://localhost:9090"
    isDefault: true
  - name: Loki
    type: loki
    uid: "{{ ds_uid_loki }}"
    access: proxy
    url: "http://localhost:{{ w_loki_http_listen_port | default(3100) }}"
