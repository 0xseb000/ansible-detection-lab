---
# Grafana Collection needs python3-debian
- name: Install python3-debian
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install and configure Grafana (upstream collection role)
  ansible.builtin.include_role:
    name: grafana.grafana.grafana
  vars:
    grafana_version: "{{ w_grafana_version }}"
    grafana_datasources: "{{ w_grafana_datasources }}"
